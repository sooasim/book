<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전자책출판 독립프로그램</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #fff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d7dde7;
      --blue: #2563eb;
      --green: #15803d;
      --yellow: #a16207;
      --red: #b42318;
      --gray: #667085;
      --blue-soft: #eff6ff;
      --green-soft: #ecfdf3;
      --yellow-soft: #fffaeb;
      --red-soft: #fef3f2;
      --gray-soft: #f2f4f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Malgun Gothic", "Segoe UI", Arial, sans-serif;
    }

    header {
      height: 58px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 12px;
    }

    h1 {
      font-size: 19px;
      margin: 0;
      letter-spacing: 0;
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    main {
      padding: 14px;
      display: grid;
      grid-template-columns: 310px minmax(460px, 1fr) 360px;
      gap: 12px;
    }

    .metrics {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .metric, .panel, .item, .row, .notice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric { padding: 12px; min-height: 76px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 24px; font-weight: 900; margin-top: 4px; }

    .panel { min-height: 470px; overflow: hidden; }
    .panel h2 {
      margin: 0;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .body { padding: 10px; display: grid; gap: 9px; }

    .item { padding: 10px; }
    .item.active { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
    .title { font-weight: 900; }
    .muted { color: var(--muted); font-size: 12px; }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .tag.ok { color: var(--green); background: var(--green-soft); }
    .tag.warn { color: var(--yellow); background: var(--yellow-soft); }
    .tag.err { color: var(--red); background: var(--red-soft); }
    .tag.info { color: var(--blue); background: var(--blue-soft); }
    .tag.idle { color: var(--gray); background: var(--gray-soft); }

    .row {
      padding: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .notice { padding: 10px; background: #fff; }
    .notice strong { display: block; margin-bottom: 3px; }

    .log {
      min-height: 88px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      background: #111827;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    dialog {
      width: min(820px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
    }
    dialog::backdrop { background: rgba(15, 23, 42, .3); }
    .dialog-head { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
    .dialog-body { padding: 12px; display: grid; gap: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 4px; font-weight: 700; }
    input, textarea, select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      width: 100%;
    }
    textarea { min-height: 92px; grid-column: 1 / -1; }

    @media (max-width: 1180px) {
      main { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      header { height: auto; padding: 12px; align-items: flex-start; flex-direction: column; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>전자책출판 독립프로그램</h1>
    <div class="toolbar">
      <button id="refreshBtn">새로고침</button>
      <button id="toolBtn">도구 점검</button>
      <button id="packBtn" class="primary">제출팩 생성</button>
    </div>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="panel">
      <h2>책</h2>
      <div class="body" id="books"></div>
    </section>

    <section class="panel">
      <h2>플랫폼 진행</h2>
      <div class="body" id="platforms"></div>
    </section>

    <section class="panel">
      <h2>다음 행동</h2>
      <div class="body">
        <div id="notices"></div>
        <button id="assistBtn">KDP 반매크로 명령 보기</button>
        <button id="editBookBtn">선택한 책 정보 수정</button>
        <div class="log" id="log">준비됨</div>
      </div>
    </section>
  </main>

  <dialog id="bookDialog">
    <form method="dialog">
      <div class="dialog-head">
        <strong>책 정보 수정</strong>
        <button value="cancel">닫기</button>
      </div>
      <div class="dialog-body">
        <div class="form-grid">
          <label>책 ID<input id="book_id"></label>
          <label>제목<input id="title"></label>
          <label>부제<input id="subtitle"></label>
          <label>저자<input id="author"></label>
          <label>언어<input id="language"></label>
          <label>가격 KRW<input id="price_krw"></label>
          <label>가격 USD<input id="price_usd"></label>
          <label>출판일<input id="publication_date"></label>
          <label>원고 경로<input id="manuscript_path"></label>
          <label>표지 경로<input id="cover_path"></label>
          <label>키워드<input id="keywords"></label>
          <label>카테고리<input id="categories"></label>
          <label>소개문<textarea id="description"></textarea></label>
          <label>메모<textarea id="notes"></textarea></label>
        </div>
        <div class="toolbar">
          <button id="saveBookBtn" class="primary" value="default">저장</button>
        </div>
      </div>
    </form>
  </dialog>

  <script>
    let state = null;
    let selectedBookId = null;

    const $ = (id) => document.getElementById(id);
    const log = (msg) => { $("log").textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2); };

    function tagClass(status) {
      if (["live", "approved", "registered", "prepared"].includes(status)) return "ok";
      if (["queued", "submitted", "input_ready"].includes(status)) return "info";
      if (["blocked", "rejected"].includes(status)) return "err";
      if (["human_review", "account_not_ready"].includes(status)) return "warn";
      return "idle";
    }

    function metric(label, value) {
      return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function renderMetrics() {
      const s = state.summary;
      $("metrics").innerHTML = [
        metric("책", s.books),
        metric("플랫폼", s.platforms),
        metric("제출 파일", s.pack_files),
        metric("파일 누락", s.missing_files),
        metric("브라우저 보조", s.browser_assisted),
        metric("사람 확인", s.human_wait)
      ].join("");
    }

    function renderBooks() {
      if (!selectedBookId && state.books[0]) selectedBookId = state.books[0].book_id;
      $("books").innerHTML = state.books.map(book => {
        const checks = book.file_check || {};
        const missing = Object.entries(checks).filter(([key, v]) => key !== "sample_path" && !v.exists).map(([key]) => key);
        const status = missing.length ? `${missing.join(", ")} 누락` : "파일 확인";
        return `<article class="item ${book.book_id === selectedBookId ? "active" : ""}" data-book="${book.book_id}">
          <div class="title">${book.title || book.book_id}</div>
          <div class="muted">${book.book_id} · ${book.language || "-"} · ${book.format || "-"}</div>
          <span class="tag ${missing.length ? "err" : "ok"}">${status}</span>
          <div class="muted">${book.notes || ""}</div>
        </article>`;
      }).join("") || `<div class="notice">책 정보가 없습니다.</div>`;
      document.querySelectorAll("[data-book]").forEach(el => {
        el.addEventListener("click", () => { selectedBookId = el.dataset.book; render(); });
      });
    }

    function renderPlatforms() {
      const rows = state.matrix.filter(row => row.book_id === selectedBookId);
      $("platforms").innerHTML = rows.map(row => `
        <article class="row">
          <div>
            <div class="title">${row.platform_name}</div>
            <div class="muted">${row.region} · ${row.automation_level}</div>
            <div class="muted">${row.next_action || ""}</div>
          </div>
          <span class="tag ${tagClass(row.status)}">${row.status}</span>
        </article>
      `).join("") || `<div class="notice">선택한 책의 플랫폼 상태가 없습니다.</div>`;
    }

    function renderNotices() {
      const book = state.books.find(b => b.book_id === selectedBookId) || {};
      const checks = book.file_check || {};
      const lines = [];
      if (checks.cover_path && !checks.cover_path.exists) lines.push(["표지 필요", "표지 파일 경로가 비어 있거나 존재하지 않습니다."]);
      if (checks.manuscript_path && !checks.manuscript_path.exists) lines.push(["원고 경로 확인", "원고 파일이 현재 경로에서 발견되지 않습니다."]);
      if ((book.ai_disclosure || "").toLowerCase().includes("ai")) lines.push(["AI 고지", "플랫폼별 AI 사용 고지 문항은 최종 제출 전 직접 확인해야 합니다."]);
      if ((book.kdp_select || "").toLowerCase() === "yes") lines.push(["독점 경고", "KDP Select 사용 시 다른 전자책 판매처와 충돌할 수 있습니다."]);
      lines.push(["안전 게이트", "약관 동의, 본인인증, CAPTCHA, 최종 제출은 자동으로 처리하지 않습니다."]);
      $("notices").innerHTML = lines.map(([a, b]) => `<div class="notice"><strong>${a}</strong><span class="muted">${b}</span></div>`).join("");
    }

    function render() {
      renderMetrics();
      renderBooks();
      renderPlatforms();
      renderNotices();
    }

    async function loadState() {
      const res = await fetch("/api/state");
      state = await res.json();
      render();
    }

    async function post(path, payload = {}) {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      log(data);
      await loadState();
      return data;
    }

    function setBusy(button, busy) {
      button.disabled = busy;
      button.dataset.oldText = button.dataset.oldText || button.textContent;
      button.textContent = busy ? "실행 중" : button.dataset.oldText;
    }

    $("refreshBtn").addEventListener("click", loadState);
    $("packBtn").addEventListener("click", async (e) => {
      setBusy(e.currentTarget, true);
      try { await post("/api/generate-packs"); } finally { setBusy(e.currentTarget, false); }
    });
    $("toolBtn").addEventListener("click", async (e) => {
      setBusy(e.currentTarget, true);
      try { await post("/api/check-toolchain"); } finally { setBusy(e.currentTarget, false); }
    });
    $("assistBtn").addEventListener("click", async () => {
      const res = await fetch(`/api/assist-command?book_id=${encodeURIComponent(selectedBookId || "")}&platform_id=amazon_kdp`);
      log(await res.json());
    });

    $("editBookBtn").addEventListener("click", () => {
      const book = state.books.find(b => b.book_id === selectedBookId);
      if (!book) return;
      ["book_id", "title", "subtitle", "author", "language", "price_krw", "price_usd", "publication_date", "manuscript_path", "cover_path", "keywords", "categories", "description", "notes"].forEach(id => $(id).value = book[id] || "");
      $("bookDialog").showModal();
    });

    $("saveBookBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      const payload = {};
      ["book_id", "title", "subtitle", "author", "language", "price_krw", "price_usd", "publication_date", "manuscript_path", "cover_path", "keywords", "categories", "description", "notes"].forEach(id => payload[id] = $(id).value);
      await post("/api/books", payload);
      selectedBookId = payload.book_id;
      $("bookDialog").close();
    });

    loadState().catch(err => log(String(err)));
  </script>
</body>
</html>
