<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>반매크로 테스트 폼</title>
  <style>
    body { font-family: "Malgun Gothic", Arial, sans-serif; margin: 32px; max-width: 760px; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; }
    textarea { min-height: 110px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  </style>
</head>
<body>
  <h1>전자책 등록 테스트</h1>
  <form>
    <label for="book_title">책 제목</label>
    <input id="book_title" name="book_title" placeholder="도서명">

    <label for="subtitle">부제목</label>
    <input id="subtitle" name="subtitle" placeholder="부제">

    <label for="author">저자</label>
    <input id="author" name="author" placeholder="저자명">

    <label for="description">책소개</label>
    <textarea id="description" name="description" placeholder="상세 소개"></textarea>

    <label for="keywords">키워드</label>
    <input id="keywords" name="keywords" placeholder="검색어, 태그">

    <div class="row">
      <div>
        <label for="price_krw">원화 가격</label>
        <input id="price_krw" name="price_krw" placeholder="판매가">
      </div>
      <div>
        <label for="isbn">전자책 ISBN</label>
        <input id="isbn" name="isbn" placeholder="ISBN13">
      </div>
    </div>

    <label for="language">언어</label>
    <input id="language" name="language" placeholder="언어">

    <label for="manuscript">원고 파일</label>
    <input id="manuscript" name="manuscript" type="file">

    <label for="cover">표지 이미지</label>
    <input id="cover" name="cover" type="file">
  </form>
</body>
</html>
