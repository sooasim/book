<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>OCES 자동 채우기 — 기본정보</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>출간 기본정보 (한 번만 입력)</h1>
    <p class="muted">여기 저장한 정보가 방문하는 모든 출판 사이트의 입력칸에 자동으로 채워집니다.
      비밀번호·세금·계좌·본인인증 정보는 저장하지 않습니다.</p>
    <form id="form">
      <label>제목 <input name="title" /></label>
      <label>부제 <input name="subtitle" /></label>
      <label>저자 <input name="author" /></label>
      <label>필명 <input name="pen_name" /></label>
      <label>언어 <input name="language" placeholder="ko" /></label>
      <label>짧은 소개 <input name="short_description" /></label>
      <label>긴 소개 <textarea name="description" rows="5"></textarea></label>
      <label>키워드(쉼표) <input name="keywords" /></label>
      <label>카테고리(쉼표) <input name="categories" /></label>
      <label>가격(KRW) <input name="price_krw" /></label>
      <label>가격(USD) <input name="price_usd" /></label>
      <label>ISBN <input name="isbn_ebook" /></label>
      <div class="row">
        <button type="submit">저장</button>
        <span id="status" class="muted"></span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
